<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Page Not Found | Kerala PG</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:light;--ink:#17231f;--muted:#5d6965;--paper:#f6f0e8;--brand:#31594b}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI",sans-serif}
    main{width:min(100%,680px);padding:clamp(24px,6vw,64px);border:1px solid #e7dfd1;border-radius:24px;background:#fffdf9}
    p{color:var(--muted)}
    h1{max-width:12ch;margin:.3em 0;font:600 clamp(40px,9vw,68px)/1.05 Georgia,serif;letter-spacing:-.04em}
    a{display:inline-flex;margin-top:12px;padding:12px 18px;border-radius:10px;background:var(--brand);color:white;text-decoration:none;font-weight:600}
    a:focus-visible{outline:3px solid #b4764f;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p>404 · KERALA PG</p>
    <h1>We couldn’t find that page</h1>
    <p>The link may be outdated, or the page may have moved.</p>
    <a href="/">Back to Kerala PG</a>
  </main>
</body>
</html>
